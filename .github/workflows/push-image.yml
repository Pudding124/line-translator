name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: push-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGISTRY: asia-east1-docker.pkg.dev
      IMAGE: asia-east1-docker.pkg.dev/mars-personal-512604/line-translator/webhook
    steps:
      - uses: actions/checkout@v6

      - name: Validate configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          for variable in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing repository secret: $variable"
              exit 1
            fi
          done

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false

      - name: Log in to Artifact Registry
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: printf '%s' "$ACCESS_TOKEN" | docker login "$REGISTRY" --username oauth2accesstoken --password-stdin

      - name: Prepare image tags
        id: tags
        run: echo "commit=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tags.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write image reference
        env:
          COMMIT_TAG: ${{ steps.tags.outputs.commit }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo '### Published image' >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE:$COMMIT_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
